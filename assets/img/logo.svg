<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#2c3e50" stroke="#3498db" stroke-width="3"/>
  
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#3498db" stroke-width="2" opacity="0.5"/>
  
  <!-- C shape (represents kernel cycle) -->
  <path d="M 140 60 Q 160 100 140 140" 
        fill="none" stroke="#3498db" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Inner circle (core) -->
  <circle cx="100" cy="100" r="30" fill="#3498db"/>
  
  <!-- Ultra text indicator -->
  <text x="100" y="110" font-family="Arial, sans-serif" font-size="24" 
        font-weight="bold" text-anchor="middle" fill="white">
    C_ultra
  </text>
  
  <!-- Kernel symbol (small dots in circle representing processors/threads) -->
  <circle cx="90" cy="70" r="3" fill="#ecf0f1" opacity="0.7"/>
  <circle cx="110" cy="70" r="3" fill="#ecf0f1" opacity="0.7"/>
  <circle cx="85" cy="95" r="3" fill="#ecf0f1" opacity="0.7"/>
  <circle cx="115" cy="95" r="3" fill="#ecf0f1" opacity="0.7"/>
  <circle cx="90" cy="130" r="3" fill="#ecf0f1" opacity="0.7"/>
  <circle cx="110" cy="130" r="3" fill="#ecf0f1" opacity="0.7"/>
</svg>